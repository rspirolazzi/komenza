# Compila, firma y publica la app de Android.
# Un tag mobile-v<versión> (igual a "version" de reservations-mobile/app.json) crea un GitHub
# Release con el APK arm64 y el AAB; una ejecución manual solo los sube como artefacto.
# Secretos y variables necesarios: docs/deploy.md.
name: Android release

on:
  push:
    tags: ["mobile-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Lint and type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reservations-mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reservations-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint and type check
        run: |
          npm run lint
          npx tsc --noEmit

  build:
    name: Build, sign and publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: reservations-mobile
    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      # Crece en cada ejecución: Google Play exige un versionCode mayor en cada AAB
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Check configuration
        working-directory: .
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_STORE_PASSWORD \
            ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD EXPO_PUBLIC_API_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secreto o la variable de GitHub: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reservations-mobile/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: reservations-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Read app version
        id: app_version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versión de la app: $VERSION (versionCode $ANDROID_VERSION_CODE)"

      - name: Check tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.app_version.outputs.value }}
        run: |
          if [ "$TAG" != "mobile-v$VERSION" ]; then
            echo "::error::El tag $TAG no coincide con la versión $VERSION (se esperaba mobile-v$VERSION)"
            exit 1
          fi

      - name: Write the upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # El plugin plugins/withReleaseSigning.js configura la firma con las variables ANDROID_UPLOAD_*
      - name: Generate the native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build APK (arm64) and AAB
        working-directory: reservations-mobile/android
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
          ./gradlew bundleRelease --no-daemon

      - name: Collect binaries
        id: binaries
        env:
          VERSION: ${{ steps.app_version.outputs.value }}
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/dist/komenza-$VERSION-arm64.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/dist/komenza-$VERSION.aab"
          (cd "$RUNNER_TEMP/dist" && sha256sum ./*.apk ./*.aab | sed 's| \./| |' > SHA256SUMS.txt)
          cat "$RUNNER_TEMP/dist/SHA256SUMS.txt"
          echo "dir=$RUNNER_TEMP/dist" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.app_version.outputs.value }}
          DIST: ${{ steps.binaries.outputs.dir }}
        run: |
          {
            echo "Komenza $VERSION para Android."
            echo
            echo "- \`komenza-$VERSION-arm64.apk\`: para instalar directo en el celular (arm64)."
            echo "- \`komenza-$VERSION.aab\`: para Google Play."
            echo
            echo "SHA-256:"
            echo '```'
            cat "$DIST/SHA256SUMS.txt"
            echo '```'
          } > "$DIST/notes.md"
          gh release create "$TAG" "$DIST"/*.apk "$DIST"/*.aab "$DIST/SHA256SUMS.txt" \
            --title "Komenza Android $VERSION" --notes-file "$DIST/notes.md"

      - name: Upload artifact (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: komenza-android-${{ steps.app_version.outputs.value }}
          path: ${{ steps.binaries.outputs.dir }}
          if-no-files-found: error

      - name: Remove the upload keystore
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/upload.jks"
