# Compila la API y el panel (Laravel) y los publica en el servidor de DigitalOcean.
# Secretos y variables necesarios: docs/deploy.md.
name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "reservations-backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  SERVICE: komenza-backend

jobs:
  verify:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # PHP 7.2 y Composer 1 solo están disponibles en la imagen del proyecto
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: reservations-backend
          load: true
          tags: komenza-backend:test
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend-test,mode=max

      - name: Test
        run: |
          APP_KEY="base64:$(openssl rand -base64 32)"
          echo "::add-mask::$APP_KEY"
          docker run --rm -e APP_KEY="$APP_KEY" komenza-backend:test vendor/bin/phpunit

  deploy:
    name: Build, push and deploy
    needs: verify
    # Una ejecución manual desde otra rama solo verifica; se publica solo desde main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check configuration
        env:
          DROPLET_IP: ${{ secrets.DROPLET_IP }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          missing=0
          for name in DROPLET_IP DROPLET_USER SSH_PRIVATE_KEY DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secreto o la variable de GitHub: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # El registro exige el dueño en minúsculas
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ env.SERVICE }}" >> "$GITHUB_OUTPUT"

      - name: Log in to the GitHub registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: reservations-backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMPOSER_NO_DEV=true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Update container on DigitalOcean droplet
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SERVICE: ${{ env.SERVICE }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_PATH,SERVICE
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            # Si la imagen no se puede bajar, no se toca el contenedor en marcha
            if ! docker compose pull "$SERVICE"; then
              echo "::error::El servidor no pudo bajar $SERVICE de ghcr.io: revisar su 'docker login ghcr.io' (docs/deploy.md). No se cambió la versión en marcha."
              exit 1
            fi
            # Recrea solo este servicio y espera su healthcheck. Las migraciones corren al arrancar.
            docker compose up -d --no-deps --wait --wait-timeout 180 "$SERVICE"
            docker image prune -f
            docker compose ps
            docker compose images "$SERVICE"
