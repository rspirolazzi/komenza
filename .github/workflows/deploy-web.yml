# Compila la web del cliente (Next.js) y la publica en el servidor de DigitalOcean.
# Secretos y variables necesarios: docs/deploy.md.
name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - "reservations-frontend/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  SERVICE: komenza-frontend

jobs:
  verify:
    name: Type check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reservations-frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reservations-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit --incremental false

      # Con una API ficticia: solo comprueba que compile
      - name: Build
        env:
          NEXT_PUBLIC_API_BASE: https://api.example.invalid
          NEXT_PUBLIC_API_URL: https://api.example.invalid/api/
        run: npm run build

  deploy:
    name: Build, push and deploy
    needs: verify
    # Una ejecución manual desde otra rama solo verifica; se publica solo desde main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check configuration
        env:
          DROPLET_IP: ${{ secrets.DROPLET_IP }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE }}
        run: |
          missing=0
          for name in DROPLET_IP DROPLET_USER SSH_PRIVATE_KEY DEPLOY_PATH NEXT_PUBLIC_API_BASE; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secreto o la variable de GitHub: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # El registro exige el dueño en minúsculas
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ env.SERVICE }}" >> "$GITHUB_OUTPUT"

      - name: Log in to the GitHub registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      # NEXT_PUBLIC_* queda dentro del JavaScript publicado: son variables, no secretos
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: reservations-frontend
          file: reservations-frontend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE=${{ vars.NEXT_PUBLIC_API_BASE }}
            NEXT_PUBLIC_GOOGLE_MAP_KEY=${{ vars.NEXT_PUBLIC_GOOGLE_MAP_KEY }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Update container on DigitalOcean droplet
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SERVICE: ${{ env.SERVICE }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_PATH,SERVICE
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            # Si la imagen no se puede bajar, no se toca el contenedor en marcha
            if ! docker compose pull "$SERVICE"; then
              echo "::error::El servidor no pudo bajar $SERVICE de ghcr.io: revisar su 'docker login ghcr.io' (docs/deploy.md). No se cambió la versión en marcha."
              exit 1
            fi
            # Recrea solo este servicio y espera su healthcheck
            docker compose up -d --no-deps --wait --wait-timeout 180 "$SERVICE"
            docker image prune -f
            docker compose ps
            docker compose images "$SERVICE"
